name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  # --- CI: test --------------------------------------------------------
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run backend tests
        run: ./mvnw -B clean test

  backend-dependency-security-scan:
    name: Backend Dependency Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      # Without an NVD_API_KEY secret, the scan hits NVD's public (unauthenticated) rate limit
      # downloading the CVE database, which is unreliable enough in CI to fail the job for reasons
      # that have nothing to do with this repo's dependencies. continue-on-error keeps the scan
      # informational until a key is added under repo Settings -> Secrets and variables -> Actions
      # (free from https://nvd.nist.gov/developers/request-an-api-key) — add the key, then drop
      # this continue-on-error to make it a real gate.
      - name: Run OWASP Dependency-Check with fail-closed profile
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -Psecurity-scan dependency-check:check -Ddependency-check.fail-on-error=true

  frontend:
    name: Frontend Lint, Test, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build

  # --- CD: build image, then deploy ------------------------------------
  #
  # Only runs on pushes to main/master (never on PRs, since it needs
  # write access to push an image), and only after both test jobs pass.
  build-backend-image:
    name: Build & Push Backend Image
    needs: [backend-tests, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Required for the type=gha cache-from/cache-to backend below — the
      # default "docker" driver doesn't support it, only "docker-container".
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        # ghcr.io rejects uppercase in the path; github.repository preserves
        # the repo's own casing, so this can't just be used directly.
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}/backend' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build-backend-image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # The backend host (e.g. Render) is set up to redeploy on a webhook
      # call rather than by pulling the image directly, so this step just
      # pings that hook. Until RENDER_DEPLOY_HOOK_URL is added under repo
      # Settings -> Secrets and variables -> Actions, this is a no-op —
      # see DEPLOYMENT.md.
      - name: Trigger backend deploy (Render)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set yet — skipping deploy trigger. See DEPLOYMENT.md."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      # The frontend redeploys on push automatically via Render's own
      # GitHub integration (both services in render.yaml are deployed as
      # a Render Blueprint), so it needs no step here — see DEPLOYMENT.md.
