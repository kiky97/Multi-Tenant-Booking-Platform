services:
  - type: web
    runtime: docker
    name: salon-booking-platform-backend
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    maxShutdownDelaySeconds: 120
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
      - key: APP_BOOKING_TIMEZONE
        value: Europe/Dublin
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      # Redis (slot holds, rate limiting, service/availability cache) — point these at a
      # TLS-capable free-tier provider such as Upstash; see DEPLOYMENT.md.
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL_ENABLED
        value: "true"
      # Kafka (booking-confirmed fan-out) is intentionally left unset for the live demo — the
      # producer/consumer beans still start and retry in the background without one, they just
      # never deliver. See README.md's "What's not in the live demo" section.
      - key: APP_STRIPE_SECRET_KEY
        sync: false
      - key: APP_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: APP_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: APP_STRIPE_CURRENCY
        value: eur
      - key: APP_ADMIN_BOOTSTRAP_ENABLED
        value: "false"
      - key: APP_ADMIN_BOOTSTRAP_ALLOW_PASSWORD_OVERWRITE
        value: "false"
      - key: APP_ADMIN_BOOTSTRAP_USERNAME
        sync: false
      - key: APP_ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_JWT_EXPIRATION_SECONDS
        value: "3600"
      - key: APP_JWT_ISSUER
        value: salon-booking-platform
      - key: APP_AUTH_COOKIE_SECURE
        value: "true"
      - key: APP_AUTH_COOKIE_SAME_SITE
        value: None

  - type: web
    runtime: static
    name: salon-booking-platform-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    # The frontend is served by Render Static Site, so browser-facing security
    # headers must be enforced here at the CDN edge rather than in Spring Boot.
    # The CSP below assumes the API is same-origin or hosted on Render
    # (`https://*.onrender.com`). If you move the API to a custom domain, tighten
    # connect-src to that exact origin during deployment.
    headers:
      - path: /hero-bg.mp4
        name: Cache-Control
        value: public, max-age=604800, s-maxage=31536000
      - path: /hero-bg-mobile.mp4
        name: Cache-Control
        value: public, max-age=604800, s-maxage=31536000
      - path: /hero-bg-poster.webp
        name: Cache-Control
        value: public, max-age=604800, s-maxage=31536000
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none';
          form-action 'self'; script-src 'self' https://js.stripe.com; style-src 'self'
          'unsafe-inline' https://fonts.googleapis.com; font-src 'self'
          https://fonts.gstatic.com data:; img-src 'self' data:
          https://images.unsplash.com https://*.stripe.com; connect-src 'self'
          https://*.onrender.com https://fonts.googleapis.com
          https://fonts.gstatic.com https://js.stripe.com https://api.stripe.com
          https://*.stripe.com https://m.stripe.network; frame-src 'self'
          https://js.stripe.com https://*.stripe.com; media-src 'self';
          manifest-src 'self'
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), geolocation=(), microphone=(), usb=(), browsing-topics=()
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
    routes:
      - type: redirect
        source: /admin
        destination: /admin.html
      - type: redirect
        source: /admin/
        destination: /admin.html
      - type: rewrite
        source: /*
        destination: /index.html
